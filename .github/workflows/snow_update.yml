name: Daily Snow Report Fetcher

on:
  schedule:
    # Runs everyday at 1:30 UTC (~7:30 AM MDT)
    - cron: '30 1 * * *' 
  workflow_dispatch: 

jobs:
  update-snow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ---> ADD THIS STEP HERE <---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run snow fetcher script
        run: python fetch_snow.py

      - name: Commit and push updated JSON back to repo
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add snow_report.json
          git commit -m "Auto-update daily snow report at 7:30 AM" || exit 0
          git push
